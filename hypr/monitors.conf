# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Asus OLED
env = GDK_SCALE,1.25
# monitor=DP-2,2560x1440@240, 0x0, 1
monitor=DP-2,3840x2160@240, 0x0, 1.5

# 1 vertical 1 Horizontal
monitor=DP-3, 2560x1440@180, auto, 1.25, transform, 3

# 2x Horizontal
# monitor=DP-3, 3840x2160@60, auto, 1.67

workspace=1,monitor:DP-2,default:true
workspace=2,monitor:DP-2
workspace=3,monitor:DP-2
workspace=4,monitor:DP-2
workspace=5,monitor:DP-2
workspace=6,monitor:DP-3
workspace=7,monitor:DP-3
workspace=8,monitor:DP-3
workspace=9,monitor:DP-3
workspace=0,monitor:DP-3
